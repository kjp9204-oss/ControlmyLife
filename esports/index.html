<script>
"use strict";
const categories = {all:"전체", lol:"LoL", valorant:"발로란트", pubgm:"PUBG MOBILE", festival:"게임 페스티벌", other:"기타 종목"};
const areas = {kr:"대한민국", global:"해외", online:"온라인"};
const quarterLabels = {all:"연간 전체", q1:"1분기", q2:"2분기", q3:"3분기", q4:"4분기", tba:"분기 미정"};
const initialData = JSON.parse(document.getElementById("event-data").textContent);
const kstDay = new Intl.DateTimeFormat("sv-SE", {timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"});
const kstClock = new Intl.DateTimeFormat("ko-KR", {timeZone:"Asia/Seoul", month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
const today = kstDay.format(new Date());
const $ = (id) => document.getElementById(id);
const make = (tag, className, content) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.textContent = content;
  return node;
};
const monthEnd = (year, month) => new Date(Date.UTC(year, month, 0)).toISOString().slice(0, 10);
const yearOf = (event) => event.start.slice(0, 4);
const precise = (value) => value.length === 10;
function bounds(event) {
  const start = event.start.length === 7 ? event.start + "-01" : event.start;
  const end = event.end || event.start;
  return [start, end.length === 7 ? monthEnd(Number(end.slice(0, 4)), Number(end.slice(5, 7))) : end];
}
function inQuarter(event, year, quarter) {
  if (quarter === "all") return yearOf(event) === year || event.end?.slice(0, 4) === year;
  if (quarter === "tba") return yearOf(event) === year && event.start.length === 4;
  if (event.start.length === 4) return false;
  const index = Number(quarter[1]);
  const first = String(index * 3 - 2).padStart(2, "0");
  const [start, end] = bounds(event);
  return start <= monthEnd(Number(year), index * 3) && end >= year + "-" + first + "-01";
}
function dateLabel(event) {
  const compact = (date) => date.slice(5).replace("-", ".");
  if (event.start.length === 4) return event.start + "년 · 날짜 미정";
  const end = event.end || event.start;
  if (event.start.length === 7) {
    const startMonth = Number(event.start.slice(5));
    const endMonth = Number(end.slice(5));
    return startMonth + "월" + (end !== event.start ? "–" + endMonth + "월" : "") + " · 일자 미정";
  }
  return compact(event.start) + (end !== event.start ? "–" + compact(end) : "");
}
const dayDiff = (from, to) => Math.round((Date.parse(to) - Date.parse(from)) / 86400000);
function status(event) {
  if (event.eventState === "cancelled") return ["취소", "past"];
  if (event.eventState === "postponed") return ["연기", "planned"];
  if (event.planned) return [precise(event.start) ? "일정안" : "개최 예정", "planned"];
  if (!precise(event.start)) return ["날짜 미정", "planned"];
  const [start, end] = bounds(event);
  if (end < today) return ["종료", "past"];
  if (start === today) return [start === end ? "오늘 일정" : "오늘 시작", ""];
  if (end === today) return ["오늘 마지막 날", ""];
  if (start < today) return ["진행 중", ""];
  return ["D-" + dayDiff(today, start), ""];
}
function sortEvents(a, b) {
  if (a.start.length === 4 && b.start.length !== 4) return 1;
  if (b.start.length === 4 && a.start.length !== 4) return -1;
  return bounds(a)[0].localeCompare(bounds(b)[0]) || a.title.localeCompare(b.title, "ko");
}
function external(label, url) {
  const link = make("a", "", label + " ↗");
  if (typeof url === "string" && url.startsWith("https://")) link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}
let rows = [];
const currentQuarter = "q" + Math.ceil(Number(today.slice(5, 7)) / 3);
const year = $("year");
let quarter = "all";
let category = "all";
function loadData(data) {
  const previousYear = year.value;
  rows = [...data.events].sort(sortEvents);
  const years = [...new Set(rows.flatMap(event => [yearOf(event), event.end?.slice(0, 4)].filter(Boolean)))].sort();
  year.replaceChildren(...years.map(value => new Option(value + "년", value)));
  year.value = [previousYear, today.slice(0, 4), years.at(-1)].find(value => years.includes(value));
  if (!previousYear && year.value === today.slice(0, 4) && rows.some(event => inQuarter(event, year.value, currentQuarter))) {
    quarter = currentQuarter;
  }
  $("checked").textContent = "일정 업데이트 " + data.checked + " · 시각 KST";
  quarterButtons();
  renderNext();
  render();
}
function buttons(container, labels, active, choose) {
  container.replaceChildren(...Object.entries(labels).map(([value, label]) => {
    const button = make("button", "", label);
    button.type = "button";
    button.dataset.value = value;
    button.setAttribute("aria-pressed", String(active === value));
    button.addEventListener("click", () => {
      choose(value);
      for (const item of container.children) item.setAttribute("aria-pressed", String(item.dataset.value === value));
      render();
    });
    return button;
  }));
}
function displayEvent(event) {
  const article = make("article", "event");
  const when = make("div");
  const [label, style] = status(event);
  when.append(make("p", "date-line", dateLabel(event)), make("p", "stage " + style, label));
  if (event.timing) when.append(make("p", "date-detail", event.timing));
  else if (event.region === "global" && precise(event.start)) when.append(make("p", "date-detail", "개최지 날짜"));
  const subject = make("div", "subject");
  subject.append(make("span", "type", event.categories.map(key => categories[key]).join(" · ")), make("h3", "", event.title), make("p", "note", event.note));
  const place = make("div");
  place.append(make("p", "", event.location));
  if (event.location !== areas[event.region]) place.append(make("p", "location-detail", areas[event.region]));
  const links = make("div", "links");
  links.append(external(event.source.label || "공식 일정", event.source.url));
  for (const link of event.links || []) {
    const item = make("div");
    item.append(external(link.label, link.url));
    const opens = new Date(link.opensAt);
    if (Number.isFinite(opens.getTime())) {
      let saleStatus = "오픈 예정";
      if (link.saleState === "sold-out") saleStatus = "매진 확인";
      else if (link.saleState === "closed") saleStatus = "판매 종료 확인";
      else if (link.saleState === "open") saleStatus = "예매 오픈 확인";
      else if (opens <= new Date()) saleStatus = "판매처에서 상태 확인";
      item.append(make("span", "ticket-detail", kstClock.format(opens) + " KST · " + saleStatus));
    }
    links.append(item);
  }
  article.append(when, subject, place, links);
  return article;
}
function render() {
  const query = $("query").value.trim().toLocaleLowerCase("ko");
  const area = $("area").value;
  const filtered = rows.filter(event =>
    inQuarter(event, year.value, quarter) &&
    (category === "all" || event.categories.includes(category)) &&
    (area === "all" || event.region === area) &&
    (!query || [event.title, event.note, event.location, ...event.categories.map(key => categories[key])].join(" ").toLocaleLowerCase("ko").includes(query))
  );
  $("result").textContent = year.value + "년 " + quarterLabels[quarter] + " · " + filtered.length + "건";
  const output = filtered.map(displayEvent);
  if (output.length === 0) output.push(make("p", "empty", "이 조건에 해당하는 일정이 없습니다."));
  $("events").replaceChildren(...output);
}
function renderNext() {
  const upcoming = rows.filter(event => {
    if (event.eventState || event.planned || !precise(event.start)) return false;
    const [start, end] = bounds(event);
    return end >= today && dayDiff(today, start) <= 14;
  }).sort((a, b) => Number(a.start <= today) - Number(b.start <= today) || sortEvents(a, b)).slice(0, 3);
  const cards = upcoming.map(event => {
    const link = external("", event.source.url);
    link.className = "next-card";
    link.replaceChildren(
      make("span", "next-date", dateLabel(event) + " · " + status(event)[0]),
      make("strong", "", event.title),
      make("small", "", event.location + (event.timing ? " · " + event.timing : ""))
    );
    return link;
  });
  if (cards.length === 0) cards.push(make("p", "empty", "14일 이내에 표시할 확정 일정이 없습니다."));
  $("next").replaceChildren(...cards);
}
function quarterButtons() {
  buttons($("quarters"), quarterLabels, quarter, value => {quarter = value;});
}
year.addEventListener("change", () => {quarter = "all"; quarterButtons(); render();});
$("query").addEventListener("input", render);
$("area").addEventListener("change", render);
buttons($("categories"), categories, category, value => {category = value;});
loadData(initialData);
if (location.protocol === "https:" || location.protocol === "http:") {
  fetch("./events.json", {cache:"no-cache"})
    .then(response => response.ok ? response.json() : null)
    .then(data => {
      if (Array.isArray(data?.events) && data.events.length && typeof data.checked === "string") loadData(data);
    })
    .catch(() => { /* Keep the published fallback schedule available. */ });
}
</script>
