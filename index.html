<script>
(function(){
'use strict';
var WD=['일','월','화','수','목','금','토'];
var ARROW='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
var THEATERS={'CGV':'https://www.cgv.co.kr/','메가박스':'https://www.megabox.co.kr/','롯데시네마':'https://www.lottecinema.co.kr/'};
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
function link(href,txt,cls){var a=el('a',cls||'',txt);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a;}
var TODAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
document.getElementById('today').textContent=TODAY.replace(/-/g,'.');
function concertSourceLink(concert){
  var url;
  try{url=new URL(concert.url);}catch(e){return null;}
  if(url.protocol!=='https:')return null;
  if(concert.official===false)return link(url.href,'공연 정보 보기','ghost');

  var host=url.hostname,path=url.pathname;
  var isYes24=host==='ticket.yes24.com'||host==='m.ticket.yes24.com';
  var isMelon=host==='ticket.melon.com';
  var isBookingProduct=(host==='nol.yanolja.com'&&/^\/ticket\/products\/\d+\/?$/.test(path))
    ||(isYes24&&/^\/Perf\/\d+\/?$/i.test(path))
    ||(isMelon&&path==='/performance/index.htm'&&/^\d+$/.test(url.searchParams.get('prodId')||''));
  if(isBookingProduct)return link(url.href,'예매하기');

  var isTicketNotice=(isYes24&&/^\/Notice\//i.test(path))
    ||(isMelon&&path==='/csoon/detail.htm')
    ||(host==='tickets.interpark.com'&&path.startsWith('/contents/notice/'));
  return link(url.href,isTicketNotice?'예매 공지 보기':'공식 공연 공지','ghost');
}
function start(D){
  function monthLabel(d){if(!d)return '날짜 발표 전';return d.slice(0,4)+'년 '+Number(d.slice(5,7))+'월';}
  function dbox(d){
    var b=el('div','dbox');
    if(d&&d.length===10){b.appendChild(el('div','m',Number(d.slice(5,7))+'월'));b.appendChild(el('div','d',String(Number(d.slice(8,10)))));b.appendChild(el('div','w',WD[new Date(d+'T12:00:00Z').getUTCDay()]+'요일'));}
    else if(d){b.appendChild(el('div','m',Number(d.slice(5,7))+'월'));b.appendChild(el('div','tba','날짜 미정'));}
    else b.appendChild(el('div','tba','발표 전'));
    return b;
  }
  function fmtOpen(s){return Number(s.slice(5,7))+'/'+Number(s.slice(8,10))+(s.length>10?' '+s.slice(11,16):'');}
  function upcoming(a){return a.filter(function(x){return !x.date||x.date.length<10||x.date>=TODAY;});}
  function recent(a){var lim=new Date(Date.parse(TODAY+'T00:00:00Z')-21*864e5).toISOString().slice(0,10);return a.filter(function(x){return x.date&&x.date.length===10&&x.date<TODAY&&x.date>=lim;});}
  function heading(v,eyebrow,title,desc){var h=el('div','news-head');var l=el('div');l.appendChild(el('p','eyebrow',eyebrow));l.appendChild(el('h1',null,title));if(desc)l.appendChild(el('p',null,desc));h.appendChild(l);v.appendChild(h);}
  function monthBlock(v,label){var s=el('section','month');var h=el('div','recent-heading');h.appendChild(el('h2',null,label));h.appendChild(el('span'));h.appendChild(el('small',null,'CONTROL MYLIFE'));s.appendChild(h);var l=el('div','news-list');s.appendChild(l);v.appendChild(s);return l;}
  function grouped(v,items,card){
    if(!items.length){v.appendChild(el('p','empty','지금 보여 줄 소식이 없습니다.'));return;}
    var cur=null,list=null;items.forEach(function(it){var m=it.date?it.date.slice(0,7):'';if(m!==cur||!list){cur=m;list=monthBlock(v,monthLabel(it.date));}list.appendChild(card(it));});
  }
  var concerts=upcoming(D.concerts),genre='전체';
  function concertCard(c){
    var a=el('article','news-item');a.appendChild(dbox(c.date));var b=el('div');
    var t=el('div','tags');t.appendChild(el('span','category-tag '+(c.genre||'').toLowerCase(),c.genre==='KPOP'?'국내':c.genre));
    [['선예매',c.presale],['일반예매',c.general]].forEach(function(p){if(p[1]&&p[1].slice(0,10)>=TODAY)t.appendChild(el('span','opentag',p[0]+' '+fmtOpen(p[1])));});
    b.appendChild(t);b.appendChild(el('h3',null,c.artist));b.appendChild(el('p','sub',c.title));
    b.appendChild(el('small',null,c.venue+(c.time?' · '+c.time:'')));
    var source=concertSourceLink(c);
    if(source){var k=el('div','book');k.appendChild(source);b.appendChild(k);}
    a.appendChild(b);return a;
  }
  function workCard(w){
    var a=el('article','news-item');a.appendChild(dbox(w.date));var b=el('div');
    var t=el('div','tags');if(w.theater)t.appendChild(el('span','category-tag only',w.theater));if(w.kind&&w.kind!=='개봉')t.appendChild(el('span','category-tag kind',w.kind));
    if(t.childNodes.length)b.appendChild(t);b.appendChild(el('h3',null,w.title));if(w.note)b.appendChild(el('p','sub',w.note));
    var noBook=/일본 개봉|배우 내한|날짜 발표 전|방영|TV|OTT|온라인 공개|스트리밍/.test(w.kind||'');
    if(!noBook){var k=el('div','book');var only=null;Object.keys(THEATERS).forEach(function(n){if((w.theater||'').indexOf(n)===0)only=n;});
      (only?[only]:Object.keys(THEATERS)).forEach(function(n,i){k.appendChild(link(THEATERS[n],n+' 예매',only||i===0?'':'ghost'));});b.appendChild(k);}
    a.appendChild(b);return a;
  }
  var currentYear=Number(TODAY.slice(0,4));
  var currentQuarter=Math.floor((Number(TODAY.slice(5,7))-1)/3)+1;
  var periods={concert:{year:currentYear,quarter:currentQuarter},anime:{year:currentYear,quarter:currentQuarter},movie:{year:currentYear,quarter:currentQuarter}};
  function newsPeriod(work){
    var match=/^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/.exec(work.date||'');
    if(!match)return {year:null,quarter:null};
    var year=Number(match[1]),month=Number(match[2]);
    if(!match[2]||month<1||month>12)return {year:year,quarter:null};
    if(match[3]){
      var stamp=new Date(Date.UTC(year,month-1,Number(match[3])));
      if(stamp.getUTCFullYear()!==year||stamp.getUTCMonth()!==month-1||stamp.getUTCDate()!==Number(match[3]))return {year:year,quarter:null};
    }
    return {year:year,quarter:Math.floor((month-1)/3)+1};
  }
  function renderQuarterNews(v,items,key,label,card,dateDescription){
    var period=periods[key];
    var years=Array.from(new Set([currentYear,period.year].concat(items.map(function(w){return newsPeriod(w).year;}).filter(function(y){return y!==null;})))).sort(function(a,b){return b-a;});
    var periodHead=el('div','news-period-head');
    var summary=el('div');
    var selected=items.filter(function(w){var p=newsPeriod(w);return p.year===period.year&&p.quarter===period.quarter;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    var startMonth=(period.quarter-1)*3+1;
    summary.appendChild(el('h2',null,period.year+'년 '+period.quarter+'분기'));
    summary.appendChild(el('p',null,startMonth+'~'+(startMonth+2)+'월 · '+dateDescription+' 기준 · 등록된 소식 '+selected.length+'건'));
    periodHead.appendChild(summary);
    var yearLabel=el('label','news-year','연도');
    var yearSelect=el('select');yearSelect.id=key+'-year';yearSelect.setAttribute('aria-label',label+' 소식 연도');
    years.forEach(function(y){var option=el('option',null,y+'년');option.value=String(y);yearSelect.appendChild(option);});
    yearSelect.value=String(period.year);
    yearSelect.addEventListener('change',function(){period.year=Number(yearSelect.value);render();});
    yearLabel.appendChild(yearSelect);periodHead.appendChild(yearLabel);v.appendChild(periodHead);
    var quarters=el('nav','news-quarters');quarters.setAttribute('aria-label',label+' 소식 분기');
    [1,2,3,4].forEach(function(quarter){
      var button=el('button','news-quarter');button.type='button';button.setAttribute('aria-pressed',String(period.quarter===quarter));
      button.appendChild(el('strong',null,quarter+'분기'));
      button.appendChild(el('span',null,((quarter-1)*3+1)+'~'+(quarter*3)+'월'));
      var count=items.filter(function(w){var p=newsPeriod(w);return p.year===period.year&&p.quarter===quarter;}).length;
      button.appendChild(el('small',null,count+'건'));
      button.addEventListener('click',function(){period.quarter=quarter;render();});quarters.appendChild(button);
    });v.appendChild(quarters);
    if(selected.length)grouped(v,selected,card);
    else v.appendChild(el('p','empty',period.year+'년 '+period.quarter+'분기에 등록된 '+label+' 소식이 없습니다.'));
    var unknown=items.filter(function(w){var p=newsPeriod(w);return p.quarter===null&&(p.year===null||p.year===period.year);});
    if(unknown.length){
      var pending=el('section','news-unannounced');
      pending.appendChild(el('h2',null,'일정 미정'));
      pending.appendChild(el('p',null,dateDescription+'이 발표되면 해당 분기에 표시합니다.'));
      var list=el('div','news-list');unknown.forEach(function(w){var item=Object.assign({},w,{date:''});list.appendChild(card(item));});pending.appendChild(list);v.appendChild(pending);
    }
  }
  function renderConcert(v){
    heading(v,'LIVE IN KOREA','분기별 공연 소식','해외 아티스트 내한 공연과 관심 가수 공연을 연도와 분기로 모아 봅니다. 티켓 오픈일은 공연일과 구분해 표시합니다.');
    var dashboard=el('div','book');var dashboardLink=el('a',null,'공연·티켓팅 전광판 열기');dashboardLink.href='./concerts/';dashboard.appendChild(dashboardLink);v.appendChild(dashboard);
    var f=el('div','filters');['전체','JPOP','POP','KPOP'].forEach(function(g){var x=el('button',null,g==='KPOP'?'국내':g);x.type='button';x.setAttribute('aria-pressed',String(g===genre));x.addEventListener('click',function(){genre=g;render();});f.appendChild(x);});v.appendChild(f);
    renderQuarterNews(v,D.concerts.filter(function(c){return genre==='전체'||c.genre===genre;}),'concert','공연',concertCard,'공연일');
  }
  function renderAnime(v){
    heading(v,'ANIME','분기별 애니 소식','TV·온라인 방영 소식과 극장판 개봉·재개봉을 연도와 분기로 모아 봅니다.');
    renderQuarterNews(v,D.anime,'anime','애니',workCard,'방영·개봉일');
  }
  function renderMovie(v){
    heading(v,'MOVIE','분기별 영화 소식','국내 극장 개봉·재개봉과 관련 행사 소식을 연도와 분기로 모아 봅니다. 한 극장에서만 거는 작품은 빨간 표시로 알려 드립니다.');
    renderQuarterNews(v,D.movies,'movie','영화',workCard,'개봉·행사일');
  }

  var q='';
  function renderPosts(v){
    heading(v,'ARCHIVE','지난 글','그동안 쓴 문화·취미 글입니다. 제목을 누르면 네이버 블로그로 이동합니다. 「최근 글」은 블로그 안 검색으로 그 글을 찾아 줍니다.');
    var s=el('div','searchbar');var i=el('input');i.type='search';i.id='post-search';i.placeholder='제목으로 찾기 (예: 귀멸, 공연, 나루토)';i.value=q;i.setAttribute('aria-label','지난 글 제목 검색');s.appendChild(i);v.appendChild(s);
    var box=el('div','post-list');v.appendChild(box);
    function fill(){box.textContent='';var k=q.trim().toLowerCase();var rows=D.posts.filter(function(p){return !k||p.t.toLowerCase().indexOf(k)>=0;});
      if(!rows.length){box.appendChild(el('p','empty','찾는 제목이 없습니다.'));return;}
      rows.forEach(function(p){var a=link(p.u,null,'post-row');if(p.d){var tm=el('time',null,p.d.replace(/-/g,'.'));tm.dateTime=p.d;a.appendChild(tm);}else a.appendChild(el('span','site',p.r?'최근 글':'사이트 글'));a.appendChild(el('span','pt',p.t));var ar=el('span');ar.innerHTML=ARROW;a.appendChild(ar);box.appendChild(a);});}
    i.addEventListener('input',function(){q=i.value;fill();});fill();
  }
  var view='concert';
  function render(){
    document.querySelectorAll('.category-cell').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.v===view));});
    var v=document.getElementById('view');v.textContent='';
    if(view==='concert')renderConcert(v);
    else if(view==='anime')renderAnime(v);
    else if(view==='movie')renderMovie(v);
    else renderPosts(v);
  }
  function fromHash(){var h=location.hash.replace('#','');if(['concert','anime','movie','posts'].indexOf(h)>=0)view=h;}
  document.getElementById('n-concert').textContent=D.concerts.length;
  document.getElementById('n-anime').textContent=D.anime.length;
  document.getElementById('n-movie').textContent=D.movies.length;
  document.getElementById('n-posts').textContent=D.posts.length;
  document.getElementById('upd').textContent='소식 갱신 '+D.updated.replace(/-/g,'.');
  document.querySelectorAll('.category-cell').forEach(function(t){t.addEventListener('click',function(){view=t.dataset.v;try{history.replaceState(null,'','#'+view);}catch(e){location.hash=view;}render();});});
  window.addEventListener('hashchange',function(){fromHash();render();});
  fromHash();render();
}
var raw=document.getElementById('data').textContent.trim();
if(raw&&raw!==''){start(JSON.parse(raw));}
else{fetch('./data/news.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(start).catch(function(){document.getElementById('view').appendChild(el('p','empty','소식을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.'));});}
})();
</script>
</body>
</html>
