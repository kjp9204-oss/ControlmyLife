<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Control My Life — 내한 공연, 애니, 영화 개봉 소식을 한곳에서.">
<title>Control My Life 소식판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 짙은 갈색 머리띠 + 크림 바탕, 명조 제목, 위에 큰 숫자 칸 4개, 아래 날짜 칸이 붙은 목록 */
  --band:#3a2a20; --band-ink:#f4ead8;
  --paper:#f5efe3; --card:#fffbf3;
  --ink:#2a211b; --muted:#76685c; --line:#e2d7c4;
  --accent:#a2462c; --soon:#2f6b4f;
  --display:"Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
a{color:inherit}
.band{background:var(--band);color:var(--band-ink);padding:22px 20px 18px}
.band .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.band h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em}
.band p{margin:2px 0 0;font-size:13px;opacity:.8}
.band .upd{font-size:12px;opacity:.75}
.wrap{max-width:980px;margin:0 auto}
main{padding:20px 16px 48px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tile:hover{border-color:var(--muted)}
.tile:focus-visible,.chip:focus-visible,.search:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .n{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.tile[aria-selected="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.tile[aria-selected="true"] .l{color:var(--band-ink);opacity:.8}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font:inherit}
h2.month{font-family:var(--display);font-weight:600;font-size:18px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);text-wrap:balance}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:64px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.date{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date .d{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.date .w{font-size:12px;color:var(--muted)}
.date .tba{font-size:12px;color:var(--muted);line-height:1.3;padding-top:4px}
.t{font-weight:700;font-size:16px;line-height:1.4}
.sub{color:var(--muted);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tag{font-size:12px;border-radius:4px;padding:1px 7px;background:#efe6d6;color:#5a4a3c}
.tag.only{background:#f3dfd6;color:var(--accent)}
.tag.open{background:#dcebe2;color:var(--soon);font-weight:700}
.src{font-size:12px;color:var(--muted);margin-left:auto}
.posts .row{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.posts .row:hover .pt{text-decoration:underline}
.posts .pd{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:20px 0}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:30px;padding-top:12px}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .item{grid-template-columns:52px 1fr;gap:10px}
  .src{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div>
      <h1>Control My Life</h1>
      <p>내한 공연 · 애니 · 영화 소식</p>
    </div>
    <div class="upd" id="upd"></div>
  </div>
</header>
<main class="wrap">
  <div class="tiles" role="tablist" aria-label="소식 종류">
    <button class="tile" role="tab" id="tab-concert" data-v="concert"><div class="n" id="n-concert">0</div><div class="l">공연 (내한·국내)</div></button>
    <button class="tile" role="tab" id="tab-anime" data-v="anime"><div class="n" id="n-anime">0</div><div class="l">애니</div></button>
    <button class="tile" role="tab" id="tab-movie" data-v="movie"><div class="n" id="n-movie">0</div><div class="l">영화</div></button>
    <button class="tile" role="tab" id="tab-posts" data-v="posts"><div class="n" id="n-posts">0</div><div class="l">지난 글 (네이버)</div></button>
  </div>
  <div id="view"></div>
  <footer>날짜·장소는 바뀔 수 있습니다. 예매 전에 예매처 공지를 한 번 더 확인하세요. 지난 글은 네이버 블로그로 연결됩니다.</footer>
</main>
<script id="data" type="application/json"></script>
<script>
(function(){
'use strict';
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
var raw=document.getElementById('data').textContent.trim();
function start(D){
var WD=['일','월','화','수','목','금','토'];
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
var TODAY=today();
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
function monthLabel(d){if(!d)return '날짜 발표 전';var p=d.split('-');return p[0]+'년 '+Number(p[1])+'월';}
function dateBox(d){
  var b=el('div','date');
  if(d&&d.length===10){b.appendChild(el('div','w',Number(d.slice(5,7))+'월'));b.appendChild(el('div','d',String(Number(d.slice(8,10)))));b.appendChild(el('div','w',WD[new Date(d+'T12:00:00Z').getUTCDay()]+'요일'));}
  else if(d){b.appendChild(el('div','w',Number(d.slice(5,7))+'월'));b.appendChild(el('div','tba','날짜 미정'));}
  else{b.appendChild(el('div','tba','날짜 발표 전'));}
  return b;
}
function fmtOpen(s){var d=s.slice(5,10).replace('-','/').replace(/^0/,'');var t=s.slice(11,16);return d+(t?' '+t:'');}
function groupRender(items,renderFn,host){
  if(!items.length){host.appendChild(el('p','empty','지금 보여 줄 소식이 없습니다.'));return;}
  var cur=null,list=null;
  items.forEach(function(it){var m=it.date?it.date.slice(0,7):'';if(m!==cur){cur=m;host.appendChild(el('h2','month',monthLabel(it.date)));list=el('div','list');host.appendChild(list);}list.appendChild(renderFn(it));});
}
function upcoming(arr){return arr.filter(function(x){return !x.date||x.date.length<10||x.date>=TODAY;});}
function recent(arr){var lim=new Date(Date.parse(TODAY+'T00:00:00Z')-21*864e5).toISOString().slice(0,10);return arr.filter(function(x){return x.date&&x.date.length===10&&x.date<TODAY&&x.date>=lim;});}
var concerts=upcoming(D.concerts);
var genreFilter='전체';
function concertCard(c){
  var a=el('article','item');a.appendChild(dateBox(c.date));
  var b=el('div');b.appendChild(el('div','t',c.artist));b.appendChild(el('div','sub',c.title));
  b.appendChild(el('div','sub',c.venue+(c.time?' · '+c.time:'')));
  var m=el('div','meta');if(c.genre)m.appendChild(el('span','tag',c.genre));
  [['선예매',c.presale],['일반예매',c.general]].forEach(function(p){if(p[1]&&p[1].slice(0,10)>=TODAY)m.appendChild(el('span','tag open',p[0]+' '+fmtOpen(p[1])));});
  var s=el('a','src','예매처·출처 열기');s.href=c.url;s.target='_blank';s.rel='noopener';m.appendChild(s);
  b.appendChild(m);a.appendChild(b);return a;
}
function workCard(w){
  var a=el('article','item');a.appendChild(dateBox(w.date));
  var b=el('div');b.appendChild(el('div','t',w.title));if(w.note)b.appendChild(el('div','sub',w.note));
  var m=el('div','meta');if(w.kind&&w.kind!=='개봉')m.appendChild(el('span','tag',w.kind));if(w.theater)m.appendChild(el('span','tag only',w.theater));
  if(m.childNodes.length)b.appendChild(m);a.appendChild(b);return a;
}
function renderConcert(v){
  var bar=el('div','bar');
  ['전체','JPOP','POP','KPOP'].forEach(function(g){var c=el('button','chip',g);c.type='button';c.setAttribute('aria-pressed',String(g===genreFilter));c.addEventListener('click',function(){genreFilter=g;render();});bar.appendChild(c);});
  v.appendChild(bar);
  groupRender(concerts.filter(function(c){return genreFilter==='전체'||c.genre===genreFilter;}),concertCard,v);
}
function renderWorks(v,arr){
  var up=upcoming(arr).sort(function(a,b){return (a.date||'9999').localeCompare(b.date||'9999');});
  var rc=recent(arr);
  if(rc.length){v.appendChild(el('h2','month','최근 개봉 · 3주 안'));var l=el('div','list');rc.forEach(function(w){l.appendChild(workCard(w));});v.appendChild(l);}
  groupRender(up,workCard,v);
}
var q='';
function renderPosts(v){
  var bar=el('div','bar');var s=el('input','search');s.type='search';s.id='post-search';s.placeholder='지난 글 제목 검색';s.value=q;s.setAttribute('aria-label','지난 글 제목 검색');
  bar.appendChild(s);v.appendChild(bar);var box=el('div','posts');v.appendChild(box);
  function fill(){box.textContent='';var k=q.trim().toLowerCase();var rows=D.posts.filter(function(p){return !k||p.t.toLowerCase().indexOf(k)>=0;});
    if(!rows.length){box.appendChild(el('p','empty','찾는 제목이 없습니다.'));return;}
    rows.forEach(function(p){var a=el('a','row');a.href=p.u;a.target='_blank';a.rel='noopener';a.appendChild(el('span','pd',p.d||'사이트 글'));a.appendChild(el('span','pt',p.t));box.appendChild(a);});}
  s.addEventListener('input',function(){q=s.value;fill();});fill();
}
var view='concert';
function render(){
  document.querySelectorAll('.tile').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.v===view));});
  var v=document.getElementById('view');v.textContent='';
  if(view==='concert')renderConcert(v);else if(view==='anime')renderWorks(v,D.anime);else if(view==='movie')renderWorks(v,D.movies);else renderPosts(v);
}
function fromHash(){var h=location.hash.replace('#','');if(['concert','anime','movie','posts'].indexOf(h)>=0)view=h;}
document.getElementById('n-concert').textContent=concerts.length;
document.getElementById('n-anime').textContent=upcoming(D.anime).length+recent(D.anime).length;
document.getElementById('n-movie').textContent=upcoming(D.movies).length+recent(D.movies).length;
document.getElementById('n-posts').textContent=D.posts.length;
document.getElementById('upd').textContent='소식 갱신 '+D.updated;
document.querySelectorAll('.tile').forEach(function(t){t.addEventListener('click',function(){view=t.dataset.v;try{history.replaceState(null,'','#'+view);}catch(e){location.hash=view;}render();});});
window.addEventListener('hashchange',function(){fromHash();render();});
fromHash();render();
}
if(raw&&raw!==''){start(JSON.parse(raw));}else{fetch('./data/news.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(start).catch(function(){document.getElementById('view').appendChild(el('p','empty','소식을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.'));});}
})();
</script>
</body>
</html>
