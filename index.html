<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<meta name="robots" content="index,follow">
<meta name="description" content="Control Mylife — 내한 공연, 애니, 영화 소식과 지난 기록.">
<title>Control Mylife</title>
<link rel="stylesheet" href="./assets/index-B074ZQkF.css">
<link rel="canonical" href="https://kjp9204-oss.github.io/ControlmyLife/">
<style>
/* 기존 Control Mylife 디자인(검정 바탕·빨강 포인트·Anton 로고)을 그대로 쓰고, 소식 목록에 필요한 부분만 더함 */
.category-nav{grid-template-columns:1fr 1fr 1fr .8fr}
.category-cell{cursor:pointer;color:inherit;text-align:left;font:inherit}
.category-cell[aria-selected="true"]{background:#d90b13}
.category-cell[aria-selected="true"]:hover{background:#e4121a}
.category-cell .cnt{font-family:Anton,sans-serif;font-size:22px;color:#fff;opacity:.9;z-index:2}
.category-cell.posts strong{font-size:clamp(28px,2.8vw,44px)}
.news{padding:34px 0 60px}
.news-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:6px}
.news-head h1{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1.15}
.news-head p{color:var(--muted);font-size:14px;line-height:1.7;margin-top:8px;max-width:640px}
.filters{display:flex;gap:22px;border-bottom:1px solid #777;margin-top:22px;overflow-x:auto}
.filters button{padding:12px 2px;font-size:17px;font-weight:700;white-space:nowrap;color:#ddd}
.filters button[aria-pressed="true"]{border-bottom:3px solid var(--red);color:#ff777b}
.month{margin-top:34px}
.month .recent-heading h2{font-size:30px}
.news-list{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.news-item{display:flex;gap:18px;align-items:flex-start;padding:22px 0;border-top:1px solid #414147}
.dbox{width:66px;flex-shrink:0;text-align:center;border:1px solid #414147;padding:8px 0 7px;background:#121215}
.dbox .m{font-size:11px;letter-spacing:1px;color:#aaa}
.dbox .d{font-family:Anton,sans-serif;font-size:34px;line-height:1.05;color:#fa676d}
.dbox .w{font-size:12px;color:#ccc}
.dbox .tba{font-size:12px;color:#ccc;padding:10px 4px;line-height:1.3}
.news-item>div:not(.dbox){flex:1;min-width:0}
.news-item h3{font-size:19px;line-height:1.45;margin:7px 0 2px;word-break:keep-all}
.news-item .sub{font-size:14px;color:#cfcfd4;line-height:1.55;word-break:keep-all}
.news-item small{display:block;color:#aaa;font-size:12.5px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.category-tag.jpop{background:#174f9d}.category-tag.pop{background:#5d477e}.category-tag.kpop{background:#2b6e4f}
.category-tag.only{background:#d90b13}.category-tag.kind{background:#3a3a40}
.opentag{font-size:12px;font-weight:700;color:#ffd36b;border:1px solid #6b5a22;padding:2px 8px}
.book{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.book a{display:inline-flex;align-items:center;gap:8px;border:1px solid #fa5a5f;background:#d90b13;color:#fff;font-size:14px;font-weight:800;padding:7px 14px}
.book a:hover{background:#f51d25;text-decoration:none}
.book a.ghost{background:none;border-color:#77777b;color:#ddd;font-weight:700}
.book a.ghost:hover{border-color:#ddd}
.searchbar{border-bottom:1px solid #999;display:flex;align-items:center;max-width:420px;margin-top:22px}
.searchbar input{width:100%;border:0;background:none;color:inherit;padding:14px 0;font-size:16px}
.post-list{margin-top:10px}
.post-row{display:grid;grid-template-columns:110px 1fr 20px;gap:16px;align-items:center;padding:15px 0;border-top:1px solid #414147}
.post-row:hover{text-decoration:none;background:#141417}
.post-row:hover .pt{text-decoration:underline;text-underline-offset:5px}
.post-row time,.post-row .site{color:#aaa;font-size:13px;font-variant-numeric:tabular-nums}
.post-row .site{color:#fa676d}
.pt{font-size:16.5px;line-height:1.5;word-break:keep-all}
.empty{color:#aaa;padding:30px 0}
.foot{border-top:1px solid #414147;color:#999;font-size:13px;line-height:1.7;padding:20px 0 40px}
@media(max-width:900px){.news-list{grid-template-columns:1fr}.news-head h1{font-size:34px}}
@media(max-width:700px){.category-nav{grid-template-columns:1fr 1fr 1fr 1fr}.category-cell .nav-note,.category-cell .cnt{display:none}.category-cell.posts strong{font-size:5.4vw}.post-row{grid-template-columns:84px 1fr}.post-row svg{display:none}.dbox{width:56px}.dbox .d{font-size:28px}}
</style>
</head>
<body>
<div id="root"><div class="site-shell">
<a href="#view" class="skip-link">본문 바로가기</a>
<header>
  <div class="utility">
    <nav aria-label="연결 사이트"><a href="https://kjp9204-oss.github.io/grand-library/" target="_blank" rel="noopener noreferrer">대도서관</a><span>/</span><a href="https://kjp9204-oss.github.io/handphysio/" target="_blank" rel="noopener noreferrer">HandPhysio</a><span>/</span><a href="#concert" aria-current="page">Control Mylife</a></nav>
    <p>좋아하는 걸 더 오래, 더 깊이.<span id="today"></span></p>
  </div>
  <div class="masthead">
    <a class="mast-logo" href="#concert" aria-label="Control Mylife 홈"><div class="wordmark"><span>CONTROL</span> <span>MYLIFE</span><img class="brush" alt="" src="./assets/brush-underline.png"></div><span class="zine">MANGA<br>CLUB<br>ZINE</span></a>
    <div class="mast-story"><div><img alt="좋아하는 것이 나를 만든다." src="./assets/slogan.png"><small>LIVE / ANIME / MOVIE<br>A BETTER ME</small></div><p>공연과<br>애니, 영화<br>소식판.</p></div>
  </div>
  <nav class="category-nav" role="tablist" aria-label="소식 종류">
    <button class="category-cell" role="tab" data-v="concert"><strong>공연</strong><span class="nav-note">내한·관심<br>가수 공연<span class="cnt" id="n-concert"></span></span><img alt="" src="./assets/nav-hobby.png"></button>
    <button class="category-cell anime-cell" role="tab" data-v="anime"><strong>애니</strong><span class="nav-note">극장판·<br>방영 소식<span class="cnt" id="n-anime"></span></span><img alt="" src="./assets/images/naver/7399579f87e0d906acc31832.png"></button>
    <button class="category-cell" role="tab" data-v="movie"><strong>영화</strong><span class="nav-note">개봉·<br>재개봉<span class="cnt" id="n-movie"></span></span><img alt="" src="./assets/nav-daily.png"></button>
    <button class="category-cell posts" role="tab" data-v="posts"><strong>지난 글</strong><span class="nav-note"><span class="cnt" id="n-posts"></span></span></button>
  </nav>
</header>
<main id="view" class="news" tabindex="-1"></main>
<footer class="foot">날짜·장소·시간은 바뀔 수 있습니다. 예매 전에 예매처 공지를 한 번 더 확인하세요. 지난 글은 네이버 블로그 원문으로 연결됩니다. <span id="upd"></span></footer>
</div></div>
<script id="data" type="application/json"></script>
<script>
(function(){
'use strict';
var WD=['일','월','화','수','목','금','토'];
var ARROW='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
var THEATERS={'CGV':'https://www.cgv.co.kr/','메가박스':'https://www.megabox.co.kr/','롯데시네마':'https://www.lottecinema.co.kr/'};
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
function link(href,txt,cls){var a=el('a',cls||'',txt);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a;}
var TODAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
document.getElementById('today').textContent=TODAY.replace(/-/g,'.');
function start(D){
  function monthLabel(d){if(!d)return '날짜 발표 전';return d.slice(0,4)+'년 '+Number(d.slice(5,7))+'월';}
  function dbox(d){
    var b=el('div','dbox');
    if(d&&d.length===10){b.appendChild(el('div','m',Number(d.slice(5,7))+'월'));b.appendChild(el('div','d',String(Number(d.slice(8,10)))));b.appendChild(el('div','w',WD[new Date(d+'T12:00:00Z').getUTCDay()]+'요일'));}
    else if(d){b.appendChild(el('div','m',Number(d.slice(5,7))+'월'));b.appendChild(el('div','tba','날짜 미정'));}
    else b.appendChild(el('div','tba','발표 전'));
    return b;
  }
  function fmtOpen(s){return Number(s.slice(5,7))+'/'+Number(s.slice(8,10))+(s.length>10?' '+s.slice(11,16):'');}
  function upcoming(a){return a.filter(function(x){return !x.date||x.date.length<10||x.date>=TODAY;});}
  function recent(a){var lim=new Date(Date.parse(TODAY+'T00:00:00Z')-21*864e5).toISOString().slice(0,10);return a.filter(function(x){return x.date&&x.date.length===10&&x.date<TODAY&&x.date>=lim;});}
  function heading(v,eyebrow,title,desc){var h=el('div','news-head');var l=el('div');l.appendChild(el('p','eyebrow',eyebrow));l.appendChild(el('h1',null,title));if(desc)l.appendChild(el('p',null,desc));h.appendChild(l);v.appendChild(h);}
  function monthBlock(v,label){var s=el('section','month');var h=el('div','recent-heading');h.appendChild(el('h2',null,label));h.appendChild(el('span'));h.appendChild(el('small',null,'CONTROL MYLIFE'));s.appendChild(h);var l=el('div','news-list');s.appendChild(l);v.appendChild(s);return l;}
  function grouped(v,items,card){
    if(!items.length){v.appendChild(el('p','empty','지금 보여 줄 소식이 없습니다.'));return;}
    var cur=null,list=null;items.forEach(function(it){var m=it.date?it.date.slice(0,7):'';if(m!==cur||!list){cur=m;list=monthBlock(v,monthLabel(it.date));}list.appendChild(card(it));});
  }
  var concerts=upcoming(D.concerts),genre='전체';
  function concertCard(c){
    var a=el('article','news-item');a.appendChild(dbox(c.date));var b=el('div');
    var t=el('div','tags');t.appendChild(el('span','category-tag '+(c.genre||'').toLowerCase(),c.genre==='KPOP'?'국내':c.genre));
    [['선예매',c.presale],['일반예매',c.general]].forEach(function(p){if(p[1]&&p[1].slice(0,10)>=TODAY)t.appendChild(el('span','opentag',p[0]+' '+fmtOpen(p[1])));});
    b.appendChild(t);b.appendChild(el('h3',null,c.artist));b.appendChild(el('p','sub',c.title));
    b.appendChild(el('small',null,c.venue+(c.time?' · '+c.time:'')));
    var k=el('div','book');k.appendChild(link(c.url,c.official===false?'공연 정보 보기':'예매하기',c.official===false?'ghost':''));b.appendChild(k);
    a.appendChild(b);return a;
  }
  function workCard(w){
    var a=el('article','news-item');a.appendChild(dbox(w.date));var b=el('div');
    var t=el('div','tags');if(w.theater)t.appendChild(el('span','category-tag only',w.theater));if(w.kind&&w.kind!=='개봉')t.appendChild(el('span','category-tag kind',w.kind));
    if(t.childNodes.length)b.appendChild(t);b.appendChild(el('h3',null,w.title));if(w.note)b.appendChild(el('p','sub',w.note));
    var noBook=/일본 개봉|배우 내한|날짜 발표 전/.test(w.kind||'');
    if(!noBook){var k=el('div','book');var only=null;Object.keys(THEATERS).forEach(function(n){if((w.theater||'').indexOf(n)===0)only=n;});
      (only?[only]:Object.keys(THEATERS)).forEach(function(n,i){k.appendChild(link(THEATERS[n],n+' 예매',only||i===0?'':'ghost'));});b.appendChild(k);}
    a.appendChild(b);return a;
  }
  function renderConcert(v){
    heading(v,'LIVE IN KOREA','공연 소식','해외 아티스트 내한 공연과 관심 가수 공연입니다. 예매 오픈이 남은 공연은 노란 표시로 알려 드립니다.');
    var f=el('div','filters');['전체','JPOP','POP','KPOP'].forEach(function(g){var x=el('button',null,g==='KPOP'?'국내':g);x.type='button';x.setAttribute('aria-pressed',String(g===genre));x.addEventListener('click',function(){genre=g;render();});f.appendChild(x);});v.appendChild(f);
    grouped(v,concerts.filter(function(c){return genre==='전체'||c.genre===genre;}),concertCard);
  }
  function renderWorks(v,arr,eyebrow,title,desc){
    heading(v,eyebrow,title,desc);
    var rc=recent(arr);if(rc.length){var l=monthBlock(v,'최근 개봉 · 3주 안');rc.forEach(function(w){l.appendChild(workCard(w));});}
    grouped(v,upcoming(arr).sort(function(a,b){return (a.date||'9999').localeCompare(b.date||'9999');}),workCard);
  }
  var q='';
  function renderPosts(v){
    heading(v,'ARCHIVE','지난 글','그동안 쓴 문화·취미 글입니다. 제목을 누르면 네이버 블로그 원문으로 이동합니다.');
    var s=el('div','searchbar');var i=el('input');i.type='search';i.id='post-search';i.placeholder='제목으로 찾기 (예: 귀멸, 공연, 나루토)';i.value=q;i.setAttribute('aria-label','지난 글 제목 검색');s.appendChild(i);v.appendChild(s);
    var box=el('div','post-list');v.appendChild(box);
    function fill(){box.textContent='';var k=q.trim().toLowerCase();var rows=D.posts.filter(function(p){return !k||p.t.toLowerCase().indexOf(k)>=0;});
      if(!rows.length){box.appendChild(el('p','empty','찾는 제목이 없습니다.'));return;}
      rows.forEach(function(p){var a=link(p.u,null,'post-row');if(p.d){var tm=el('time',null,p.d.replace(/-/g,'.'));tm.dateTime=p.d;a.appendChild(tm);}else a.appendChild(el('span','site','사이트 글'));a.appendChild(el('span','pt',p.t));var ar=el('span');ar.innerHTML=ARROW;a.appendChild(ar);box.appendChild(a);});}
    i.addEventListener('input',function(){q=i.value;fill();});fill();
  }
  var view='concert';
  function render(){
    document.querySelectorAll('.category-cell').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.v===view));});
    var v=document.getElementById('view');v.textContent='';
    if(view==='concert')renderConcert(v);
    else if(view==='anime')renderWorks(v,D.anime,'ANIME','애니 소식','국내 극장 개봉·재개봉 애니와 새로 방영하는 작품입니다.');
    else if(view==='movie')renderWorks(v,D.movies,'MOVIE','영화 소식','국내 극장 개봉작입니다. 한 극장에서만 거는 작품은 빨간 표시로 알려 드립니다.');
    else renderPosts(v);
  }
  function fromHash(){var h=location.hash.replace('#','');if(['concert','anime','movie','posts'].indexOf(h)>=0)view=h;}
  document.getElementById('n-concert').textContent=concerts.length;
  document.getElementById('n-anime').textContent=upcoming(D.anime).length+recent(D.anime).length;
  document.getElementById('n-movie').textContent=upcoming(D.movies).length+recent(D.movies).length;
  document.getElementById('n-posts').textContent=D.posts.length;
  document.getElementById('upd').textContent='소식 갱신 '+D.updated.replace(/-/g,'.');
  document.querySelectorAll('.category-cell').forEach(function(t){t.addEventListener('click',function(){view=t.dataset.v;try{history.replaceState(null,'','#'+view);}catch(e){location.hash=view;}render();});});
  window.addEventListener('hashchange',function(){fromHash();render();});
  fromHash();render();
}
var raw=document.getElementById('data').textContent.trim();
if(raw&&raw!==''){start(JSON.parse(raw));}
else{fetch('./data/news.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(start).catch(function(){document.getElementById('view').appendChild(el('p','empty','소식을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.'));});}
})();
</script>
</body>
</html>
